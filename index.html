<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIMNET Hızlı Kurulum</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <div class="logo-block" aria-hidden="true">
          <div class="shield">T</div>
        </div>
        <div>
          <p class="brand">TIMNET</p>
          <h1>Format Sonrası Tek Tık Kurulum</h1>
          <p class="subtitle">
            Temel programları tek seferde seç, sırayla indirip kur.
          </p>
        </div>
      </header>

      <section class="grid" aria-label="Program listesi">
        <article class="card selected">
          <label>
            <input type="checkbox" checked />
            <span>
              <strong>Microsoft Visual C++ Redistributable</strong>
              <small>2005-2022 tüm sürümler (x86 + x64)</small>
            </span>
          </label>
        </article>
        <article class="card selected">
          <label>
            <input type="checkbox" checked />
            <span>
              <strong>Microsoft .NET Framework</strong>
              <small>Windows için önerilen en güncel sürüm</small>
            </span>
          </label>
        </article>
        <article class="card selected">
          <label>
            <input type="checkbox" checked />
            <span>
              <strong>.NET Desktop Runtime</strong>
              <small>Modern masaüstü yazılımlar için</small>
            </span>
          </label>
        </article>
        <article class="card selected">
          <label>
            <input type="checkbox" checked />
            <span>
              <strong>DirectX End-User Runtime</strong>
              <small>Oyun ve multimedya uyumluluğu</small>
            </span>
          </label>
        </article>
        <article class="card selected">
          <label>
            <input type="checkbox" checked />
            <span>
              <strong>Google Chrome</strong>
              <small>Web Tarayıcı</small>
            </span>
          </label>
        </article>
        <article class="card selected">
          <label>
            <input type="checkbox" checked />
            <span>
              <strong>Java JDK 21</strong>
              <small>Java Platformu</small>
            </span>
          </label>
        </article>
        <article class="card selected">
          <label>
            <input type="checkbox" checked />
            <span>
              <strong>WinRAR 7.01</strong>
              <small>Arşiv Yöneticisi</small>
            </span>
          </label>
        </article>
      </section>

      <footer class="actions">
        <button class="ghost" type="button">Tümünü Seç</button>
        <button class="primary" type="button">Seçilenleri Kur (7)</button>
      </footer>
    </main>
  </body>
</html>
